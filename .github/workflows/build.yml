name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ── Job 1: Pester Tests + Coverage ──────────────────────────────────────────
  test:
    name: Run Pester Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck
          Import-Module Pester

      - name: Run Tests & Coverage
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path                  = "./tests"
          $config.TestResult.Enabled        = $true
          $config.TestResult.OutputPath     = "testResults.xml"
          $config.TestResult.OutputFormat   = "NUnitXml"
          $config.CodeCoverage.Enabled      = $true
          $config.CodeCoverage.Path         = "./module"
          $config.CodeCoverage.OutputPath   = "coverage.xml"
          $config.CodeCoverage.OutputFormat = "JaCoCo"
          $config.Output.Verbosity          = "Detailed"

          $result = Invoke-Pester -Configuration $config

          # ── fail on test failures ─────────────────────────────────────────
          if ($result.FailedCount -gt 0) {
            Write-Host "::error::$($result.FailedCount) test(s) failed."
            exit 1
          }

          # ── fail on low coverage ──────────────────────────────────────────
          $threshold = 70

          [xml]$xml = Get-Content coverage.xml
          $cov = 0; $mis = 0
          foreach ($pkg in $xml.report.package) {
            $c = $pkg.counter | Where-Object { $_.type -eq "LINE" }
            if ($c) { $cov += [int]$c.covered; $mis += [int]$c.missed }
          }
          $total = $cov + $mis
          $pct   = if ($total -gt 0) { [math]::Round($cov / $total * 100, 1) } else { 0 }

          Write-Host "Line coverage: $pct% (threshold: $threshold%)"

          if ($pct -lt $threshold) {
            Write-Host "::error::Coverage $pct% is below the required threshold of $threshold%."
            exit 1
          }

          Write-Host "✅ All tests passed. Coverage: $pct%"

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@6f51ac03b87f4154ef4ae7d1ab69d9111e0cd75 # v4.5.0
        with:
          name: test-results
          path: testResults.xml

      - name: Publish Coverage XML
        if: always()
        uses: actions/upload-artifact@6f51ac03b87f4154ef4ae7d1ab69d9111e0cd75 # v4.5.0
        with:
          name: coverage
          path: coverage.xml

  # ── Job 2: SonarQube Analysis ─────────────────────────────────────────────────
  sonarqube:
    name: SonarQube
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download Coverage XML
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89 # v4.2.1
        with:
          name: coverage

      - name: SonarQube Scan
        # ⚠️ TODO: replace <SONAR_SHA> with the full commit SHA for v6
        # Get it from: https://github.com/SonarSource/sonarqube-scan-action/releases/tag/v6
        # Click the short SHA next to the release to get the full 40-char hash
        uses: SonarSource/sonarqube-scan-action@aa23b563a0766d3c07853eb04e319eb6cd5dff53 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
