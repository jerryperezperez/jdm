name: Release jdm on tag

on:
  push:
    tags:
      - 'v*'   # any tag starting with v, e.g., v0.2.0

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write   # needed for creating releases and uploading assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for correct tag info

      - name: Set up PowerShell Core
        uses: microsoft/setup-powershell@v2
        with:
          pwsh-version: '7.4'

      - name: Install PS2EXE module
        shell: pwsh
        run: |
          Install-Module -Name PS2EXE -Scope CurrentUser -Force -AllowClobber

      - name: Build jdm.exe
        id: build_exe
        shell: pwsh
        run: |
          $outputDir = "${{ github.workspace }}\\dist"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          Invoke-PS2EXE -InputFile "${{ github.workspace }}\\module\\jdm.ps1" -OutputFile "${outputDir}\\jdm.exe" -noConsole

      - name: Package release assets
        id: package
        shell: pwsh
        run: |
          $dist = "${{ github.workspace }}\\dist"
          $tag = "${{ github.ref_name }}"
          # zip the executable
          $exeZip = "${{ github.workspace }}\\jdm-${tag}-binary.zip"
          Compress-Archive -Path "$dist\\jdm.exe" -DestinationPath $exeZip -Force
          # zip source code (excluding .git, .github, .vscode, dist)
          $srcZip = "${{ github.workspace }}\\jdm-${tag}-source.zip"
          $exclude = @('.git', '.github', '.vscode', 'dist')
          $items = Get-ChildItem -Path ${{ github.workspace }} -Recurse -File |
                    Where-Object { $exclude -notcontains $_.Directory.Name }
          $items | ForEach-Object { $_.FullName } | Compress-Archive -DestinationPath $srcZip -Force
          echo "exe_zip=$exeZip" >> $Env:GITHUB_OUTPUT
          echo "src_zip=$srcZip" >> $Env:GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary zip asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.exe_zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload source zip asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.src_zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
